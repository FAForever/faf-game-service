quarkus:
  log:
    level: INFO
    console:
      format: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c] (%t) %s %X%e%n"
  devservices:
    enabled: false
  application:
    name: faf-game-service
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    db-kind: mariadb
    username: ${DATABASE_USERNAME:faf-game-service}
    password: ${DATABASE_PASSWORD:banana}
    jdbc:
      url: jdbc:mariadb://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:faf_lobby}?ssl=false
  management:
    enabled: true
  http:
    host-enabled: false

rabbitmq-host: ${RABBITMQ_HOST:localhost}
rabbitmq-port: ${RABBITMQ_PORT:5672}
rabbitmq-username: ${RABBITMQ_USER:faf-game-service}
rabbitmq-password: ${RABBITMQ_PASSWORD:banana}
rabbitmq-virtual-host: ${RABBITMQ_VHOST:/faf-core}

faf:
  instance-id: ${HOSTNAME:local}
  minimum-database-version: 143

mp:
  messaging:
    outgoing:
      lobby-outbound:
        connector: smallrye-rabbitmq
        exchange:
          name: lobby-message-outbound
      lobby-schema-registration:
        connector: smallrye-rabbitmq
        exchange:
          name: lobby-schema-register
      player-session-request:
        connector: smallrye-rabbitmq
        exchange:
          name: lobby-session-request
    incoming:
      game-inbound:
        connector: smallrye-rabbitmq
        queue:
          name: game.message.game.${faf.instance-id}
          exclusive: true
          auto-delete: true
        exchange:
          name: lobby-message-inbound
        routing-keys: lobby.game.#
      gpg-inbound:
        connector: smallrye-rabbitmq
        queue:
          name: game.message.gpg.${faf.instance-id}
          exclusive: true
          auto-delete: true
        exchange:
          name: lobby-message-inbound
        routing-keys: gpg.#
      player-session-state:
        connector: smallrye-rabbitmq
        queue:
          name: game.session.state.${faf.instance-id}
          exclusive: true
          auto-delete: true
        exchange:
          name: lobby-session-state
          durable: true
      lobby-schema-request:
        connector: smallrye-rabbitmq
        exchange:
          name: lobby-schema-request
        queue:
          name: game.schema.request.${faf.instance-id}
          exclusive: true
          auto-delete: true

"%test":
  quarkus:
    scheduler:
      enabled: false
    log:
      console:
        json:
          enabled: false
      category:
        "com.faforever":
          level: DEBUG

"%dev":
  quarkus:
    live-reload:
      instrumentation: true
    log:
      console:
        json:
          enabled: false
      category:
        "com.faforever":
          level: DEBUG
        "io.smallrye.reactive.messaging.rabbitmq":
          level: DEBUG
    hibernate-orm:
      log:
        sql: true
